name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/**', 'build/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Public anon key only. Never put a Supabase service-role or Gemini key here.
      ORG_GRADLE_PROJECT_MAYA_SUPABASE_ANON_KEY: ${{ vars.MAYA_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify public app configuration
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_MAYA_SUPABASE_ANON_KEY" ]]; then
            echo '::error::Set the repository Actions variable MAYA_SUPABASE_ANON_KEY to the Supabase public anon key. Do not use the service-role key.'
            exit 1
          fi

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" 2>&1 | head -20
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" 'platforms;android-34' 'build-tools;34.0.0'
          else
            echo "sdkmanager not found at $SM; relying on preinstalled SDK"
          fi

      - name: Decode stable preview keystore
        shell: bash
        env:
          MAYA_KEYSTORE_BASE64: ${{ secrets.MAYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MAYA_KEYSTORE_BASE64" ]; then
            printf '%s' "$MAYA_KEYSTORE_BASE64" | base64 -d > /tmp/maya-preview.keystore
            echo "ORG_GRADLE_PROJECT_MAYA_KEYSTORE_PATH=/tmp/maya-preview.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build and check
        shell: bash
        env:
          ORG_GRADLE_PROJECT_MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MAYA_KEY_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MAYA_KEY_ALIAS: mayapreview
          ORG_GRADLE_PROJECT_MAYA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Verify APK signature and copy download
        shell: bash
        env:
          MAYA_KEYSTORE_PASSWORD: ${{ secrets.MAYA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          if [ -f /tmp/maya-preview.keystore ]; then
            KS_SHA=$(keytool -list -v -alias mayapreview -keystore /tmp/maya-preview.keystore -storetype PKCS12 -storepass "$MAYA_KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}')
            APK_SHA=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "keystore-cert-sha256=$KS_SHA"
            echo "apk-cert-sha256=$APK_SHA"
            if [ -z "$KS_SHA" ] || [ "$KS_SHA" != "$APK_SHA" ]; then
              echo "SIGNER MISMATCH: APK is not signed with the dedicated Maya preview key"
              exit 1
            fi
            echo "signer_match=YES - APK signed with the dedicated Maya preview key"
          else
            echo "signer_match=SKIPPED - no stable keystore in this run (debug signing fallback; NOT a deliverable candidate)"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/Maya-preview.apk
          (cd dist && sha256sum Maya-preview.apk > Maya-preview.apk.sha256)

      - name: Save APK download
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: Maya-preview-${{ github.run_number }}
          path: |
            dist/Maya-preview.apk
            dist/Maya-preview.apk.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Add download instructions to build summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo '## Maya preview APK'
            printf 'Download: %s\n\n' "$ARTIFACT_URL"
            echo 'Download the artifact ZIP, extract Maya-preview.apk, then open the APK on Android 8.0 or later.'
            echo 'GitHub sign-in and repository read access are required. Artifact expires after 3 days.'
            echo 'Preview signed with the stable Maya preview key: newer previews install over older ones.'
          } >> "$GITHUB_STEP_SUMMARY"
